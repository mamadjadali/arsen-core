# pnpm 11+ reads settings here, not from package.json#pnpm.
allowBuilds:
  sharp: true
  esbuild: true
  unrs-resolver: true
# pnpm 11 enforces minimumReleaseAge (24h) on frozen lockfile installs in CI/Docker.
# Disable so recently published transitive deps (e.g. immer via recharts) do not fail deploys.
minimumReleaseAge: 0
legacyPeerDeps: true
enablePrePostScripts: true
